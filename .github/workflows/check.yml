name: check

on:
  push:
    branches-ignore: [fetch]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repo
        run: python3 scripts/validate.py
      - name: Loops are tagged
        run: python3 scripts/loops.py --check
      - name: Bundle is current
        run: python3 scripts/bundle.py --check
      - name: Validator self-test
        run: python3 scripts/validate.py --self-test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every page renders
        run: node tests/render.mjs
