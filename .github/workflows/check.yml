name: check

on:
  push:
    branches-ignore: [fetch]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repo
        run: python3 scripts/validate.py
      - name: Validator self-test
        run: python3 scripts/validate.py --self-test
